[project]
name = "nowreck"
version = "0.15.0"
description = "Deterministic verifier for AI code change explanations"
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
keywords = ["ai", "verification", "tree-sitter", "llm", "code-review"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "questionary>=2.0",
    "tree-sitter>=0.26",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-rust>=0.23",
    "tree-sitter-go>=0.25",
]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4.0"]

[project.scripts]
nowreck = "nowreck.__main__:main"

[project.urls]
Homepage = "https://github.com/AstralXVoid/NoWreck"
Source = "https://github.com/AstralXVoid/NoWreck"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nowreck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Do not explore into hand-built test repositories
norecursedirs = [".nowreck", "test_repos"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"test_milestone1/*.py" = ["E402", "E501", "F541"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["nowreck"]
reportUnusedImport = true
reportMissingTypeStubs = false
