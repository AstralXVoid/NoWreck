name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # GitHub Release
  id-token: write  # PyPI trusted publishing (OIDC)
  attestations: write  # PEP 740 signed attestations (default-on in the action)

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NoWreck with test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install build tooling
        run: python -m pip install build twine

      # ------------------------------------------------------------------
      # Quality gate — never publish with failing tests
      # ------------------------------------------------------------------
      - name: Run test suite
        run: python -m pytest tests/ -q

      # ------------------------------------------------------------------
      # Build + verify artifacts
      # ------------------------------------------------------------------
      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata and README rendering
        run: twine check dist/*

      # ------------------------------------------------------------------
      # Publish via trusted publishing (OIDC — no token in the repo).
      # Requires the PyPI project to trust this repository.
      # ------------------------------------------------------------------
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      # Only reached when publish succeeded
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true