name: NoWreck Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 06:00 UTC to catch dependency drift
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write  # Required for GitHub Code Scanning (SARIF upload)
  checks: write           # Required for JUnit check run annotations

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: NoWreck Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for --compare mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install NoWreck from repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify installation
        run: nowreck --version

      # ------------------------------------------------------------------
      # Run NoWreck verification with --compare HEAD~1
      #
      # --compare HEAD~1 is shorthand for --pre HEAD~1 --post HEAD.
      # It extracts both git states via `git archive`, scans them, detects
      # structural changes, and reports any issues. Exit code 0 = clean,
      # exit code 1 = contradicted/unverifiable/unexplained changes.
      # ------------------------------------------------------------------

      # SARIF output → GitHub Code Scanning
      - name: Run NoWreck (SARIF)
        id: sarif
        continue-on-error: true
        run: nowreck fix --compare HEAD~1 --format sarif --output nowreck.sarif

      # JUnit output → Check Run annotations
      - name: Run NoWreck (JUnit)
        id: junit
        continue-on-error: true
        run: nowreck fix --compare HEAD~1 --format junit --output nowreck-junit.xml

      # ------------------------------------------------------------------
      # Report upload — run regardless of verification outcome
      # ------------------------------------------------------------------

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && (steps.sarif.outcome == 'success' || steps.sarif.outcome == 'failure')
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nowreck.sarif
          category: nowreck

      - name: Publish JUnit report
        if: always() && (steps.junit.outcome == 'success' || steps.junit.outcome == 'failure')
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: nowreck-junit.xml
          check_name: NoWreck Verification Report
          fail_on_failure: false
          annotate_only: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nowreck-reports
          path: |
            nowreck.sarif
            nowreck-junit.xml
          retention-days: 30
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Final verification gate
      #
      # Reports and artifacts are uploaded above regardless of outcome.
      # This step fails the job if either NoWreck run found issues.
      # ------------------------------------------------------------------
      - name: Verification gate
        if: always()
        run: |
          if [ "${{ steps.sarif.outcome }}" = "failure" ] || [ "${{ steps.junit.outcome }}" = "failure" ]; then
            echo "::error::NoWreck verification failed — contradicted, unverifiable, or unexplained changes detected."
            exit 1
          fi
          echo "NoWreck verification passed."
