name: NoWreck Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 06:00 UTC to catch dependency drift
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write  # Required for GitHub Code Scanning (SARIF upload)
  checks: write           # Required for JUnit check run annotations

env:
  PYTHON_VERSION: "3.12"
  # Commit a file named nowreck-claims.json at the repository root to arm
  # the strict gate for that commit: NoWreck then verifies those claims
  # against the HEAD~1..HEAD diff and the job fails on any contradicted,
  # unverifiable, or unexplained change. Without the file, NoWreck runs in
  # report-only mode — SARIF/JUnit are still produced (Code Scanning alerts,
  # check annotations), but plain structural changes do not fail the build.
  CLAIMS_FILE: nowreck-claims.json

jobs:
  verify:
    name: NoWreck Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for --compare mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install NoWreck from repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify installation
        run: nowreck --version

      # ------------------------------------------------------------------
      # Run NoWreck verification with --compare HEAD~1
      #
      # --compare HEAD~1 is shorthand for --pre HEAD~1 --post HEAD.
      # It extracts both git states via `git archive`, scans them, detects
      # structural changes, and reports any issues. Exit code 0 = clean,
      # exit code 1 = contradicted/unverifiable/unexplained changes.
      #
      # When a nowreck-claims.json file is committed at HEAD, its claims
      # are verified against the diff (@file syntax, v0.14.0). Otherwise
      # NoWreck runs without claims: changes are reported, not gated.
      # ------------------------------------------------------------------

      # SARIF output → GitHub Code Scanning
      - name: Run NoWreck (SARIF)
        id: sarif
        continue-on-error: true
        run: |
          CLAIMS_ARGS=""
          if [ -f "$CLAIMS_FILE" ]; then
            CLAIMS_ARGS="--claims @$CLAIMS_FILE"
          fi
          nowreck fix --compare HEAD~1 $CLAIMS_ARGS --format sarif --output nowreck.sarif

      # JUnit output → Check Run annotations
      - name: Run NoWreck (JUnit)
        id: junit
        continue-on-error: true
        run: |
          CLAIMS_ARGS=""
          if [ -f "$CLAIMS_FILE" ]; then
            CLAIMS_ARGS="--claims @$CLAIMS_FILE"
          fi
          nowreck fix --compare HEAD~1 $CLAIMS_ARGS --format junit --output nowreck-junit.xml

      # ------------------------------------------------------------------
      # Report upload — run regardless of verification outcome
      # ------------------------------------------------------------------

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && (steps.sarif.outcome == 'success' || steps.sarif.outcome == 'failure')
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nowreck.sarif
          category: nowreck

      - name: Publish JUnit report
        if: always() && (steps.junit.outcome == 'success' || steps.junit.outcome == 'failure')
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: nowreck-junit.xml
          check_name: NoWreck Verification Report
          fail_on_failure: false
          annotate_only: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nowreck-reports
          path: |
            nowreck.sarif
            nowreck-junit.xml
          retention-days: 30
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Final verification gate
      #
      # Reports and artifacts are uploaded above regardless of outcome.
      # The gate is strict only for claims-verified commits: when a
      # nowreck-claims.json file is present, the job fails if either
      # NoWreck run found contradicted/unverifiable/unexplained issues.
      # Commits without a claims file are report-only and never fail here.
      # ------------------------------------------------------------------
      - name: Verification gate
        if: always()
        run: |
          if [ -f "$CLAIMS_FILE" ]; then
            if [ "${{ steps.sarif.outcome }}" = "failure" ] || [ "${{ steps.junit.outcome }}" = "failure" ]; then
              echo "::error::NoWreck verification failed — contradicted, unverifiable, or unexplained changes detected."
              exit 1
            fi
            echo "NoWreck verification passed ($CLAIMS_FILE claims verified)."
          else
            echo "No $CLAIMS_FILE committed — NoWreck ran in report-only mode (no hard gate)."
          fi
